plugins {
    id 'com.android.library' version '8.5.1'
    id 'maven-publish'
}

android {
    namespace 'com.github.catvod.crawler'
    compileSdk 35

    defaultConfig {
        minSdk 23
        targetSdk 28
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // 只发布 release 变体，并附带 sources jar，便于其它项目调试
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

def gsonVersion = '2.13.2'
def okhttpVersion = '5.3.2'

dependencies {
    api 'androidx.annotation:annotation:1.3.0'
    api 'com.orhanobut:logger:2.2.0'
    api "com.google.code.gson:gson:$gsonVersion"
    api "com.squareup.okhttp3:okhttp:$okhttpVersion"
    api 'androidx.preference:preference:1.2.1'
    api('com.google.guava:guava:33.0.0-android') {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.checkerframework', module: 'checker-compat-qual'
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'org.codehaus.mojo', module: 'animal-sniffer-annotations'
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.cyf783'
                artifactId = 'bhbox-catvod'
                version = '1.0.0'
            }
        }
    }

    // JitPack 默认执行 `gradlew install` 来发布产物，但 maven-publish 插件不提供
    // install 任务（那是旧 maven 插件的）。这里把 install 委托给 publishToMavenLocal，
    // 让 JitPack 能把 AAR/POM 发布到本地仓库（~/.m2）并成功找到产物。
    tasks.register('install') {
        dependsOn 'publishToMavenLocal'
    }
}
